<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>StorageBar 预览</title>
    <link rel="stylesheet" href="preview.css">
    <script src="preview.js" type="module"></script>
  </head>
  <body>
    <main>
      <h1 id="title">预览</h1>
      <p id="status" role="status">正在等待内容…</p>
      <pre id="text" hidden></pre>
      <video id="video" controls playsinline preload="metadata" aria-label="本地视频" hidden></video>
      <audio id="audio" controls preload="metadata" aria-label="本地音频" hidden></audio>
      <img id="image" alt="" hidden>
    </main>
  </body>
</html>
